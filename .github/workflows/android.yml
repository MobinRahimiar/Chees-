name: Android CI and APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_stockfish:
        description: "Build with Stockfish (if project supports it)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Check project files
        run: |
          echo "Checking Android project..."
          ls -la
          test -f settings.gradle.kts -o -f settings.gradle
          test -f gradlew

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate Gradle
        run: ./gradlew --version

      - name: Run unit tests
        run: ./gradlew test

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessMasterAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
