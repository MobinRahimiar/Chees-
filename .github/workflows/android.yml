name: ChessMasterAI Android Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ChessMasterAI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-36"
          sdkmanager --install "build-tools;36.0.0"

      - name: Check project files
        run: |
          echo "Checking Android project..."
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          echo "Project files found!"

      - name: Check Gradle
        run: gradle --version

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          find app/build/outputs/apk -name "*.apk"
          test -f app/build/outputs/apk/debug/app-debug.apk
          echo "APK successfully generated!"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessMasterAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
